name: Daily Cloud Research

on:
  workflow_dispatch:
  schedule:
    - cron: "0 14 * * *"

permissions:
  contents: write
  issues: write

jobs:
  collect-and-analyze:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Collect daily internet candidate material
        run: python internet_source_collector.py

      - name: Run divine pattern analyzer
        run: python divine_pattern_analyzer.py

      - name: Build GitHub issue summary
        run: python build_github_issue_summary.py

      - name: Create GitHub notification issue
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs");
            const body = fs.readFileSync("reports/github_issue_summary.md", "utf8");
            const date = new Date().toISOString().slice(0, 10);
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Daily Cloud Research Results - ${date}`,
              body,
              labels: ["daily-research"]
            });

      - name: Commit updated references, evaluation queue, and reports
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Update daily cloud research evaluation set"
          file_pattern: "references/*.json reports/*.txt reports/*.md research_documents/cloud_references_summary.md research_documents/daily_evaluation_queue.md"
