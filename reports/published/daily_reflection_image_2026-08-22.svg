    <text x="104" y="108" class="title">22</text>
  </g>
  <g transform="rotate(-2 340 270)">
  <text x="146" y="172" class="diary">Does this pattern help love become</text><text x="146" y="200" class="diary">more honest and reparative?</text>
    <text x="146" y="310" class="label">Why this page feels different</text>
    <text x="146" y="342" class="diary">The visual emphasizes repair:</text><text x="146" y="370" class="diary">separated pieces drawn back toward</text><text x="146" y="398" class="diary">truthful care.</text>
