    <circle cx="798" cy="216" r="18" fill="#ffffff" opacity="0.22"/>
    <text x="638" y="226" class="cardtitle">Carry this</text>
  <text x="638" y="278" class="cardtext">Today, honor one</text><text x="638" y="302" class="cardtext">person before they are</text><text x="638" y="326" class="cardtext">useful to you.</text>
