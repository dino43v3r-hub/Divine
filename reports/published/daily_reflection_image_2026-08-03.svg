<svg xmlns="http://www.w3.org/2000/svg" width="900" height="540" viewBox="0 0 900 540" role="img" aria-labelledby="title desc">
  <title id="title">Diary page: pastoral safety</title>
  <desc id="desc">A daily diary page image with notebook paper, margin notes, and an application card.</desc>
  <style>
    .eyebrow { font: 700 14px Arial, sans-serif; letter-spacing: 0; fill: #28334d; opacity: 0.68; }
    .title { font: 700 32px Georgia, serif; letter-spacing: 0; fill: #28334d; }
    .diary { font: 20px Georgia, serif; letter-spacing: 0; fill: #28334d; }
    .label { font: 700 13px Arial, sans-serif; letter-spacing: 0; fill: #28334d; opacity: 0.72; }
    .cardtitle { font: 700 22px Arial, sans-serif; letter-spacing: 0; fill: #ffffff; }
    .cardtext { font: 16px Arial, sans-serif; letter-spacing: 0; fill: #ffffff; opacity: 0.94; }
    .small { font: 14px Arial, sans-serif; letter-spacing: 0; fill: #28334d; opacity: 0.70; }
  </style>
  <rect width="900" height="540" fill="#f4f1f8"/>
  <rect x="0" y="0" width="900" height="540" fill="#28334d" opacity="0.05"/>
  <g transform="rotate(1 340 270)">
    <rect x="82" y="54" width="520" height="430" rx="10" fill="#fffdf7" stroke="#28334d" stroke-width="2" opacity="0.96"/>
    <rect x="82" y="54" width="58" height="430" rx="10" fill="#4f7d73" opacity="0.20"/>
    <line x1="142" y1="72" x2="142" y2="466" stroke="#b56b45" stroke-width="2" opacity="0.40"/>
    <line x1="124" y1="126" x2="576" y2="126" stroke="#28334d" stroke-width="1.4" opacity="0.18"/><line x1="124" y1="158" x2="576" y2="158" stroke="#28334d" stroke-width="1.4" opacity="0.18"/><line x1="124" y1="190" x2="576" y2="190" stroke="#28334d" stroke-width="1.4" opacity="0.18"/><line x1="124" y1="222" x2="576" y2="222" stroke="#28334d" stroke-width="1.4" opacity="0.18"/><line x1="124" y1="254" x2="576" y2="254" stroke="#28334d" stroke-width="1.4" opacity="0.18"/><line x1="124" y1="286" x2="576" y2="286" stroke="#28334d" stroke-width="1.4" opacity="0.18"/><line x1="124" y1="318" x2="576" y2="318" stroke="#28334d" stroke-width="1.4" opacity="0.18"/><line x1="124" y1="350" x2="576" y2="350" stroke="#28334d" stroke-width="1.4" opacity="0.18"/><line x1="124" y1="382" x2="576" y2="382" stroke="#28334d" stroke-width="1.4" opacity="0.18"/><line x1="124" y1="414" x2="576" y2="414" stroke="#28334d" stroke-width="1.4" opacity="0.18"/>
    <text x="166" y="96" class="eyebrow">Research diary | August 03, 2026</text>
    <text x="166" y="126" class="title">Trinity as Behavior</text>
    <text x="146" y="146" class="label">Question I carried</text>
    <text x="104" y="108" class="title">03</text>
  </g>
  <g transform="rotate(1 340 270)">
  <text x="146" y="172" class="diary">Could this be spoken gently beside</text><text x="146" y="200" class="diary">someone who is hurting?</text>
    <text x="146" y="310" class="label">Why this page feels different</text>
    <text x="146" y="342" class="diary">The visual leaves more open space,</text><text x="146" y="370" class="diary">because some patterns should not</text><text x="146" y="398" class="diary">crowd grief.</text>
  </g>
  <g transform="rotate(-2 714 306)">
    <rect x="606" y="176" width="232" height="206" rx="24" fill="#b56b45" opacity="0.94"/>
    <circle cx="798" cy="216" r="18" fill="#ffffff" opacity="0.22"/>
    <text x="638" y="226" class="cardtitle">Carry this</text>
  <text x="638" y="278" class="cardtext">Today, test one belief</text><text x="638" y="302" class="cardtext">by whether it produces</text><text x="638" y="326" class="cardtext">humility, love, and</text><text x="638" y="350" class="cardtext">service.</text>
  </g>
  <path d="M664 430 C706 404 766 408 810 442" fill="none" stroke="#28334d" stroke-width="4" opacity="0.18"/>
  <text x="606" y="470" class="small">This image is a diary page, not a pattern map.</text>
</svg>
