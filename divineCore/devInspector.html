<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Divine Core Developer Inspector</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Arial, sans-serif;
      line-height: 1.5;
      color: #1f2933;
      background: #f6f7f9;
    }

    body {
      margin: 0;
      padding: 24px;
    }

    main {
      max-width: 1180px;
      margin: 0 auto;
    }

    h1,
    h2,
    h3 {
      margin: 0;
      line-height: 1.2;
    }

    header {
      margin-bottom: 20px;
    }

    header p {
      max-width: 820px;
      margin: 10px 0 0;
      color: #52606d;
    }

    .layout {
      display: grid;
      grid-template-columns: minmax(260px, 360px) minmax(0, 1fr);
      gap: 18px;
      align-items: start;
    }

    .panel {
      border: 1px solid #d9e2ec;
      border-radius: 8px;
      background: #ffffff;
      padding: 16px;
    }

    .sample-list {
      display: grid;
      gap: 10px;
      margin-top: 14px;
    }

    button {
      width: 100%;
      border: 1px solid #bcccdc;
      border-radius: 6px;
      background: #ffffff;
      color: #1f2933;
      padding: 10px 12px;
      font: inherit;
      text-align: left;
      cursor: pointer;
    }

    button:hover,
    button:focus {
      border-color: #486581;
      outline: none;
    }

    button[aria-pressed="true"] {
      border-color: #1f2933;
      background: #eef2f7;
      font-weight: 700;
    }

    dl {
      display: grid;
      grid-template-columns: max-content 1fr;
      gap: 6px 12px;
      margin: 14px 0 0;
    }

    dt {
      color: #52606d;
      font-weight: 700;
    }

    dd {
      margin: 0;
    }

    pre {
      min-height: 420px;
      margin: 14px 0 0;
      padding: 16px;
      overflow: auto;
      border-radius: 8px;
      background: #101820;
      color: #f5f7fa;
      font-size: 13px;
      line-height: 1.45;
      tab-size: 2;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .trace-list {
      display: grid;
      gap: 8px;
      margin: 14px 0 0;
      padding: 0;
      list-style: none;
    }

    .trace-list li {
      padding: 8px 10px;
      border-radius: 6px;
      background: #f0f4f8;
    }

    @media (max-width: 820px) {
      body {
        padding: 16px;
      }

      .layout {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>Divine Core Developer Inspector</h1>
      <p>
        Developer inspection tool only. Divine Core reasons only and does not write final user-facing prose;
        app-specific composers will write final prose later.
      </p>
    </header>

    <div class="layout">
      <section class="panel" aria-labelledby="samples-title">
        <h2 id="samples-title">Sample Inputs</h2>
        <div id="sample-list" class="sample-list"></div>
      </section>

      <section class="panel" aria-labelledby="output-title">
        <h2 id="output-title">Reasoning Output</h2>
        <dl>
          <dt>Next Layer</dt>
          <dd id="next-layer">Pending</dd>
          <dt>Confidence</dt>
          <dd id="confidence-summary">Pending</dd>
          <dt>Composer Safe</dt>
          <dd id="composer-safe">Pending</dd>
        </dl>
        <ul id="trace-list" class="trace-list"></ul>
        <h3>Readable JSON</h3>
        <pre id="json-output" aria-live="polite"></pre>
      </section>
    </div>
  </main>

  <script src="reasoningEvaluationEngine.js"></script>
  <script src="divineReasoningCore.js"></script>
  <script src="devInspector.js"></script>
</body>
</html>
